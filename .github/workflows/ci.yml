name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: No copy of the platform's contract
        run: |
          # The messages come from github.com/abdullah95k/securebrand-contracts
          # (REQ-022): no protos or generated code of our own.
          if git ls-files | grep -E '^api/proto/|^gen/go/|^buf(\.gen)?\.yaml$'; then
            echo "use the contract module; do not copy its protos"; exit 1
          fi
      - name: No gold set or labelled data in the repository
        run: |
          # Real comments and their labels stay off the repository
          # (docs/analysis/evaluation.md); only synthetic examples are allowed.
          if git ls-files | grep -E '\.labels\.jsonl$|\.gold\.jsonl$|(^|/)gold/|results\.jsonl$'; then
            echo "labelled or evaluated data must not be committed"; exit 1
          fi
      - name: No fbs code in the repository
        run: |
          # fbs lives in its own repository; sb-analysis takes only its
          # public protos and migrations, as a Go module dependency.
          if git ls-files | grep -E '^cmd/fbs|^cmd/fbctl|^internal/(fb|crawl|scheduler|persist)/|^deploy/helm/fbs/'; then
            echo "fbs code belongs in fbs's repository"; exit 1
          fi
      - name: Unit tests
        run: go test -race -count=1 ./...
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        # The user is "analysis", as in production: a schema of the user's
        # name must not hide the migrations' version table.
        env: {POSTGRES_USER: analysis, POSTGRES_PASSWORD: analysis, POSTGRES_DB: analysis}
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U analysis" --health-interval 2s --health-retries 30
      valkey:
        image: valkey/valkey:8-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Install ffmpeg (video key-frame tests)
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends ffmpeg
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 19092:19092 redpandadata/redpanda:v24.2.7 \
            redpanda start --mode dev-container --smp 1 --memory 1G \
            --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092 \
            --advertise-kafka-addr internal://localhost:9092,external://localhost:19092
          for i in $(seq 1 60); do docker exec redpanda rpk cluster health --exit-when-healthy && break; sleep 2; done
      # Includes the contract end-to-end test: a fake platform publishes the
      # contract's content events and every result must pass the contract's
      # conformance checks (internal/app/contract_e2e_test.go).
      - name: Integration and end-to-end tests
        env:
          SB_TEST_PG_DSN: postgres://analysis:analysis@localhost:5432/analysis?sslmode=disable
          SB_TEST_REDIS_ADDR: localhost:6379
          SB_TEST_KAFKA_BROKERS: localhost:19092
        # Every package: a test needing Postgres, Redis or Kafka skips without
        # them, so listing packages here would let new integration tests go unrun.
        run: go test -count=1 -timeout 25m ./...
      # Production's PostgreSQL is behind PgBouncer in transaction mode (no
      # prepared statements kept): the database tests run through one set
      # up the same way. The agent-role test logs in as roles it creates,
      # which this PgBouncer's user file can't list; the step above covers it.
      - name: Integration tests through PgBouncer (transaction pooling)
        env:
          SB_TEST_PG_DSN: postgres://analysis:analysis@localhost:6432/analysis?sslmode=disable
          SB_TEST_REDIS_ADDR: localhost:6379
          SB_TEST_KAFKA_BROKERS: localhost:19092
        run: |
          sed 's/host=postgres/host=127.0.0.1/' deploy/dev/pgbouncer.ini > /tmp/pgbouncer.ini
          docker run -d --name pgbouncer --network host \
            -v /tmp/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro \
            -v "$PWD/deploy/dev/pgbouncer-users.txt:/etc/pgbouncer/userlist.txt:ro" \
            edoburu/pgbouncer@sha256:8638aa563607256d3c7440437534195f1066a92b68015d89ae9d6b935b444a6d
          for i in $(seq 1 30); do pg_isready -h 127.0.0.1 -p 6432 && break; sleep 1; done
          go test -count=1 -timeout 25m -skip 'TestAgentRolesAreScopedAndReadOnly' ./internal/... ./cmd/...

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Docker build (sb-analysis and the media image)
        run: |
          docker build -f deploy/docker/Dockerfile --target sb-analysis -t sb-analysis:ci .
          docker build -f deploy/docker/Dockerfile --target analysis-media -t sb-analysis-media:ci .
          docker run --rm sb-analysis:ci help >/dev/null
          docker run --rm --entrypoint ffmpeg sb-analysis-media:ci -version >/dev/null
      - uses: azure/setup-helm@v4
      - name: Helm chart (lint, render, Kubernetes schemas)
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.6.7
          c=deploy/helm/sb-analysis
          helm lint $c
          helm lint $c -f $c/values-production.yaml
          helm template sba $c | ~/go/bin/kubeconform -strict -summary -ignore-missing-schemas
          helm template sba $c -f $c/values-production.yaml | ~/go/bin/kubeconform -strict -summary -ignore-missing-schemas
          helm template sba $c --set alerts.enabled=true,serviceMonitor.enabled=true > /tmp/monitoring.yaml
          grep -q "kind: PrometheusRule" /tmp/monitoring.yaml && grep -q "kind: ServiceMonitor" /tmp/monitoring.yaml
          # Production runs both workloads and the whisper server (the owner,
          # 7 Nov 2026); its settings are checked by TestProductionConfig
          # (internal/config).
          helm template sba $c -f $c/values-production.yaml > /tmp/production.yaml
          test "$(grep -cE '^  replicas: [1-9]' /tmp/production.yaml)" = 3
          # The whisper server: image by digest, Recreate (one volume), and
          # the analysis pointed at its Service.
          grep -q 'image: "ghcr.io/speaches-ai/speaches@sha256:' /tmp/production.yaml
          grep -q 'type: Recreate' /tmp/production.yaml
          # The model downloads by plain HTTP (the Xet client buffered it in
          # memory and was OOM-killed in production).
          grep -q 'HF_HUB_DISABLE_XET' /tmp/production.yaml
          grep -q 'base_url: http://sba-whisper:8000/v1' /tmp/production.yaml
          # Off by default.
          ! helm template sba $c | grep -q whisper
      - name: Compose files are valid (test stack and the pilot deployment)
        run: |
          docker compose -f deploy/dev/compose.yml config -q
          docker compose -f deploy/analysis/compose.yml config -q
