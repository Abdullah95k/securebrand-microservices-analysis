# Default configuration of sb-analysis. Values can be overridden by files
# passed with --config (or SB_ANALYSIS_CONFIG; comma separated, later files
# win) and by environment variables:
#   SB_ANALYSIS_<SECTION>__<KEY>=value   e.g. SB_ANALYSIS_KAFKA__BROKERS,
#   SB_ANALYSIS_ANALYSIS__POSTGRES__DSN
# The defaults suit the local test stack (make infra-up).
service:
  name: sb-analysis
  env: dev

log:
  level: info        # debug | info | warn | error
  format: json       # json | text

http:
  ops_addr: ":9090"        # /metrics, /healthz, /readyz

postgres:
  dsn: "postgres://analysis:analysis@localhost:5432/analysis?sslmode=disable"
  max_conns: 20

kafka:
  brokers: ["localhost:19092"]
  client_id: sb-analysis
  topic_prefix: ""        # prepended to every topic name (useful for shared clusters)
  produce_linger: 5ms
  # TLS to the brokers: the system roots, plus ca_file when set; cert_file
  # and key_file for mutual TLS; server_name to override the verified name.
  tls:
    enabled: false
    ca_file: ""
    cert_file: ""
    key_file: ""
    server_name: ""
  # SASL: plain, scram-sha-256 or scram-sha-512 ("" = none). Put the
  # password in SB_ANALYSIS_KAFKA__SASL__PASSWORD, not here.
  sasl:
    mechanism: ""
    username: ""
    password: ""

# Valkey shares the AI providers' rate limits (analysis.providers.*.rps)
# across every process. "" = none: each process limits itself.
valkey:
  addr: ""
  password: ""             # SB_ANALYSIS_VALKEY__PASSWORD, never here
  db: 0
  tls: {enabled: false, ca_file: ""}

# Object storage holding the media files named in media events (read only).
s3:
  endpoint: "localhost:9000"
  access_key: "fbs"
  secret_key: "fbs-secret"
  use_ssl: false
  region: "us-east-1"

analysis:
  # fb: read fb.post.v1, fb.comment.v1, fb.media.ready.v1 and fb.erasure.v1
  # through the Facebook adapter; results stay in Postgres. content: read the
  # platform's contract v1.0.0 (content.post.v1, content.comment.v1);
  # results also go to the contract's analysis.* topics.
  inputs: [fb]
  consumer_group: sb-analysis
  postgres:
    dsn: ""                # "" = postgres.dsn (tables live in schema "analysis")
    max_conns: 10
  timezone: Asia/Baghdad   # rollup days and budget days
  taxonomy_file: ""        # "" = embedded configs/analysis/taxonomy.v1.yaml
  entities_seed: ""        # "" = embedded configs/analysis/entities.seed.yaml
  calibration_dir: ""      # <model>.yaml maps written by sb-eval calibrate
  grouping:
    max_items: 40          # items of one thread per request
    max_chars: 12000       # items' text per request
    context_chars: 1500    # post text sent as context
    post_short_chars: 280  # shorter posts use the comment route
  batch:
    submit_every: 10m
    poll_every: 1m
    # Each request repeats the prompt and the output schema (about 23 KB):
    # 1,000 requests make a batch body of about 25-35 MB, built in memory.
    max_requests: 1000     # requests per provider batch
    max_items: 10000       # items claimed per route and submission (60,000 an hour)
    # ...then each claimed thread's other waiting comments, and each claimed
    # page's other waiting short posts, up to grouping.max_items a thread or
    # page and this many in all, threads first (0 = off): requests carry a
    # thread's comments, or a page's short posts, together instead of one or
    # two each.
    top_up_items: 10000
    # Live items published within this long are claimed first, within each
    # platform's share; older ones after them, oldest queued first, so the
    # backlog drains whenever fewer recent ones wait (0 = off). Off until the
    # owner confirms CLIENT-REQ-018; 48h then.
    recent_first: 0s
    submit_lease: 15m      # claimed items are leased this long until their batch is sent...
    lease: 26h             # ...then this long: > the providers' 24h batch window
    fallback_after: 12h
  realtime:
    workers: 4
    wait: 20s              # let a thread's siblings arrive before claiming
    lease: 2m
    # After an empty poll the lane waits poll, then twice as long each time
    # up to idle_poll, with one worker polling for all: the database is
    # shared (through PgBouncer), so an idle lane mustn't query it every
    # second. A real-time item is claimed within idle_poll of its wait.
    poll: 1s
    idle_poll: 15s
  # One model per content type; the evaluation (sb-eval) decides. Thinking
  # is off for classification: Claude Haiku 5.5 thinks by default and bills
  # thinking as output.
  routes:
    # max_tokens holds a full group's answer: up to grouping.max_items (40)
    # comments at about 150 output tokens each, or long posts at about 300
    # (11 Nov: at 6000 and 2000 a full group was cut off, and every item in
    # it failed). Only the tokens written are paid.
    comment:    {provider: anthropic, model: claude-haiku-5-5,  lane: batch,    thinking: "off", effort: low, max_tokens: 16000}
    post:       {provider: anthropic, model: claude-haiku-5-5,  lane: batch,    thinking: "off", effort: low, max_tokens: 16000}
    image:      {provider: anthropic, model: claude-haiku-5-5,  lane: realtime, thinking: "off", effort: low, max_tokens: 1500}
    video:      {provider: anthropic, model: claude-haiku-5-5,  lane: realtime, thinking: "off", effort: low, max_tokens: 2000}
    escalation: {provider: anthropic, model: claude-sonnet-5-5, lane: batch,    thinking: "off", effort: low, max_tokens: 4000, min_confidence: 0.6}
    # 0.02% of items: ~165 a day at 300M items a year, enough to track
    # quality month by month.
    audit:      {provider: anthropic, model: claude-opus-5-5,   lane: batch,    thinking: adaptive, effort: medium, max_tokens: 16000, sample_rate: 0.0002}
  # The real-time lane (results within minutes) takes items that mention an
  # entity a client tracks, and items from hot-tier accounts; everything
  # else goes to the half-price batch lane. Until the platform's account
  # registry publishes tiers, the hot tier is hot_accounts plus the
  # accounts clients monitor (watchlists).
  urgent:
    tracked_entities: true # alias of a tracked entity in the text -> real time
    hot_accounts: []       # e.g. ["fb:page:123"]: their posts and the comments on them
    watchlists: true       # accounts clients monitor (sb-analysis sources monitor) are hot
    refresh: 1m            # how often the watchlists are re-read
    sources: []            # older name for hot_accounts
  providers:
    anthropic:
      kind: anthropic
      base_url: ""         # "" = https://api.anthropic.com
      api_key: ""
      timeout: 120s
      max_retries: 2
      rps: 5
      batch: true
    # OpenAI-compatible endpoints: OpenAI, Gemini's compatible endpoint
    # (https://generativelanguage.googleapis.com/v1beta/openai), or a
    # self-hosted vLLM / Whisper server. Unused until a route names them.
    openai:
      kind: openai_compat
      base_url: "https://api.openai.com/v1"
      api_key: ""
      timeout: 120s
      max_retries: 2
      rps: 5
      transcribe_model: gpt-4o-mini-transcribe
    gemini:
      kind: openai_compat
      base_url: "https://generativelanguage.googleapis.com/v1beta/openai"
      api_key: ""
      timeout: 120s
      max_retries: 2
      rps: 5
    # An own speech-to-text server with an OpenAI-compatible API (for
    # example faster-whisper with Whisper large-v3-turbo). Cheaper than a
    # per-minute API above ~150M items a year (design section 16); used
    # only if it passes the Iraqi-dialect transcription test.
    whisper:
      kind: openai_compat
      base_url: "http://whisper:8000/v1"
      api_key: ""
      timeout: 300s
      max_retries: 1
      rps: 4
      transcribe_model: deepdml/faster-whisper-large-v3-turbo-ct2
    fake:
      kind: fake
  # USD per million tokens, list prices checked 2026-11-01 (Anthropic and
  # Google official pages; OpenAI from its model pages via search, to be
  # re-checked). Used for cost metrics and the budget.
  pricing:
    claude-haiku-5-5:      {input: 0.10, output: 0.50, cache_read: 0.01,  cache_write: 0.125, batch_discount: 0.5}
    claude-sonnet-5-5:     {input: 2.00, output: 10.0, cache_read: 0.10,  cache_write: 2.50,  batch_discount: 0.5}
    claude-opus-5-5:       {input: 4.00, output: 20.0, cache_read: 0.20,  cache_write: 5.00,  batch_discount: 0.5}
    gemini-3.1-flash-lite: {input: 0.25, output: 1.50, cache_read: 0.025, batch_discount: 0.5}
    gemini-3.5-flash-lite: {input: 0.30, output: 2.50, cache_read: 0.03,  batch_discount: 0.5}
    gemini-3.5-flash:      {input: 1.50, output: 9.00, cache_read: 0.15,  batch_discount: 0.5}
    gpt-5.4-nano:          {input: 0.20, output: 1.25, cache_read: 0.02,  batch_discount: 0.5}
    gpt-5.4-mini:          {input: 0.75, output: 4.50, cache_read: 0.075, batch_discount: 0.5}
    gpt-4o-mini-transcribe: {per_minute: 0.003}
    deepdml/faster-whisper-large-v3-turbo-ct2: {per_minute: 0} # own server: a fixed cost
    fake:                  {input: 0, output: 0}
  # The analysis queue's cap: at max_queue items, ingest stops taking new
  # comments (they wait in Kafka, which keeps 7 days) until the queue is
  # down to resume_queue. Posts (few, and their media waits for them), media
  # announcements and erasures keep flowing. The queue can pass max_queue by
  # at most one ingest batch, plus the posts.
  # Posts wait too, but only at a much higher cap: a safety valve, so one
  # collector's backfill can't grow the queue without bound (0 = never).
  # The share of comments analysed, in (0, 1] (1 = all): a comment is in
  # or out by its content ID alone. One outside it is counted but neither
  # stored nor analysed (its raw text stays with the platform). Real-time
  # items and comments already stored are always kept; posts aren't sampled.
  comments:
    sample_share: 1
  backpressure:
    max_queue: 200000
    resume_queue: 150000
    max_queue_posts: 1000000
    resume_queue_posts: 900000
    check_every: 5s
  rate_limit:
    key_prefix: "sb-analysis:rl:"
    # While Valkey is unreachable, each process sends at rps / this.
    fallback_divisor: 4
  budget:
    # USD per day (analysis.timezone). 0 = no cap, accepted only with
    # service.env dev or allow_unlimited: true (production gets $5).
    daily_usd: 0
    allow_unlimited: false
    urgent_exempt: true
  media:
    enabled: true
    consumer: analysis     # fbs's acks (fb.media.processed.v1); the contract's carry "sb-analysis"
    # fbs's media kinds (fb.media.ready.v1) analysed.
    kinds: [photo, video, reel, comment_photo, comment_video, cover, image]
    # The contract's media (content.media.ready.v1) analysed, as type/role.
    # Others (stickers, GIFs, thumbnails of videos, profile pictures,
    # banners, audio, documents) are acknowledged as SKIPPED.
    contract_kinds: [image/content, image/attachment, image/cover, video/content, video/attachment]
    # Per process; lowered at start to fit the container's memory limit
    # (worker_memory_mib each, after 256 MiB for the rest): 4 fit in 2 GiB.
    workers: 4
    worker_memory_mib: 384
    max_bytes: 524288000       # a video, streamed to disk (500 MiB)
    image_max_bytes: 33554432  # an image, read into memory (32 MiB)
    image_max_pixels: 40000000 # 40 megapixels: about 160 MiB decoded
    image_max_side: 1024
    poll: 2s
    idle_poll: 30s         # as realtime.idle_poll: one worker polls an empty queue, less often
    lease: 10m
    max_tries: 5
    # A file whose post (or comment) isn't stored yet, because ingest is
    # paused or the post comes later, waits for it in the queue without
    # counting a try: the post's text and captions go with it (captions spare
    # Whisper). It goes ahead without them owner_wait after it arrived (Kafka
    # keeps 7 days) or owner_margin before its deadline, whichever is first.
    # Storing the post wakes it. 0 = no wait.
    owner_wait: 168h
    owner_margin: 12h
    video:
      enabled: true
      ffmpeg: ffmpeg       # needs the image built with --target analysis-media
      max_frames: 8
      frame_side: 512
      max_seconds: 600
      stt_provider: ""     # e.g. openai or whisper; "" = no transcript
      stt_language: ar
      stt_concurrency: 1   # transcriptions at once (per media process)
      stt_wait: 5s         # then the video goes back to the queue...
      stt_retry_after: 2m  # ...for this long, without counting a try
      timeout: 5m
      temp_dir: ""
  privacy:
    mask_pii: true         # phones and e-mails masked before text leaves
    mask_tagged_users: true # tagged people's names become "@user" before text leaves
  # What an erasure event (fb.erasure.v1) does here. The contract's
  # lifecycle.erasure.v1 is dormant (no erasure process yet).
  # The owner keeps all data: "record" stores the request and deletes
  # nothing; "apply" deletes the subject's analysis data; "off" ignores it.
  erasure:
    mode: record
  rollups:
    every: 5m
  limits:
    max_attempts: 5
    candidate_min_seen: 20
  # Topics the model finds missing from the list are deduplicated (same
  # words in English or Arabic, or a known brand/person name -> "@entity")
  # and kept as candidates; once used by approve_min_items items, a daily
  # check by the curation model merges synonyms, rejects names of people
  # or companies, and approves the rest into the list (a new taxonomy
  # version). The taxonomy file is only the starting list.
  topics:
    dynamic: true
    approve_min_items: 5
    curate_every: 6h
    curation: {provider: anthropic, model: claude-sonnet-5-5, thinking: "off", effort: low, max_tokens: 8000}
  # New entities without a person: names the model found at least min_seen
  # times (brands, organisations, public figures, positions, places...) go
  # to the curation model, which merges spellings into known entities,
  # approves new ones and rejects private persons and generic words. The
  # owner can still decide by hand (sb-analysis entities review/resolve).
  entities:
    auto: true
    min_seen: 5
    curate_every: 6h
  # Bot and fake-account detection from behaviour (no profile data):
  # bursts, volume, the same text in many threads, the same text from many
  # authors, replies within a minute, round-the-clock posting, spam share.
  # Starting thresholds, to tune on the pilot data.
  bots:
    enabled: true
    every: 24h
    window: 720h             # 30 days
    # Authors with at least min_items items are scored on every signal;
    # smaller accounts (2+ items) are scored when they took part in
    # coordination (networks of accounts that each post a little).
    min_items: 5
    suspected_score: 45
    likely_score: 70
    coordination_authors: 5
