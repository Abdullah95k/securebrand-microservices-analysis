# Seed of the entity registry: public Iraqi brands, organisations and places
# with Arabic, English and Arabizi spellings. Loaded by `sb-analysis
# entities import` (also on first start); the owner's brand list extends or
# replaces it. Aliases are matched after normalisation (alef/yaa/taa forms,
# diacritics, clitics و/ب/ل/ال). Never alias a common word: "زين" alone means
# "good" in Iraqi Arabic, so Zain Iraq is aliased only in longer forms.
# Only public organisations and places here; public figures are added by
# review (docs/design/analysis-service.md, people policy).
entities:
