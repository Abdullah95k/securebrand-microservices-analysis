# Topic taxonomy for Iraqi news and brand pages. Proposed from domain
# knowledge (the pilot's content was not read); the owner edits or replaces
# it. Any change must bump `version`: results record it, and items can be
# re-analysed selectively. Ids are stable: never reuse a removed id.
