# The analysis service next to a running fbs stack on the same machine (the
# pilot), as a Compose project of its own:
#   - its own image (sb-analysis:dev, `make analysis-image`) and containers:
#     fbs's pilot restarts never touch them, and nothing here
#     touches fbs's containers, image, topics or settings;
#   - it joins fbs's network to read the collected content from Redpanda
#     and keep its own tables (schema `analysis`) in fbs's Postgres;
#   - provider API keys come from deploy/analysis/analysis.env (mode 600,
#     never committed).
# Start with `make analysis-up` (docs/owner/analysis-decisions.md).
name: sb-analysis

x-analysis: &analysis
  image: ${SB_ANALYSIS_IMAGE:-sb-analysis:dev}
  restart: unless-stopped
  stop_grace_period: 60s
  networks: [fbs]
  logging:
    driver: json-file
    options: {max-size: "50m", max-file: "3"}
  environment:
    SB_ANALYSIS_CONFIG: /etc/sb-analysis/pilot.yaml
    SB_ANALYSIS_POSTGRES__DSN: postgres://fbs:fbs@postgres:5432/fbs?sslmode=disable
    SB_ANALYSIS_KAFKA__BROKERS: redpanda:9092
  volumes:
    - ./pilot.yaml:/etc/sb-analysis/pilot.yaml:ro
  env_file:
    - path: ./analysis.env
      required: false

services:
  # The analysis topics only (content.*, analysis.*), sized for one broker.
  kafka-topics:
    <<: *analysis
    restart: "no"
    entrypoint: ["/usr/local/bin/sb-analysis", "kafka-topics", "--partitions-cap", "3", "--replicas", "1"]

  analysis:
    <<: *analysis
    entrypoint: ["/usr/local/bin/sb-analysis", "run"]

networks:
  fbs:
    external: true
    name: ${FBS_NETWORK:-fbs_default}
