# sb-analysis's Prometheus rules. The chart ships them as a PrometheusRule
# (alerts.enabled); they are plain Prometheus rule groups and can be loaded
# as a rule file as well. Thresholds are starting points. The test in
# internal/platform/metrics checks every metric named here exists and every
# runbook anchor is a heading of docs/runbooks/analysis.md.
groups:
  - name: sb-analysis
    rules:
      - alert: AnalysisRealtimeQueueStale
        expr: max(sb_analysis_queue_oldest_seconds{lane="realtime"}) > 7200
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: Urgent items have waited more than 2 hours for analysis
          description: The real-time lane is stuck or its provider is down (check sb_analysis_provider_requests_total).
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-analysis/blob/main/docs/runbooks/analysis.md#queue-backlog
      - alert: AnalysisBatchQueueStale
        expr: max(sb_analysis_queue_oldest_seconds{lane="batch"}) > 108000
        for: 30m
        labels: {severity: warning}
        annotations:
          summary: Items have waited more than 30 hours for batch analysis
          description: Batches are not submitted or not collected, or the budget holds them back.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-analysis/blob/main/docs/runbooks/analysis.md#queue-backlog
      - alert: AnalysisMediaTTLAtRisk
        expr: max(sb_analysis_media_ttl_at_risk) > 0
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: Media files are within 6 hours of deletion and not analysed yet
          description: Scale analysis-media or check its provider; files deleted at their TTL are lost for analysis.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-analysis/blob/main/docs/runbooks/analysis.md#media
      - alert: AnalysisDeadLetters
        expr: max(sb_analysis_dead_letters) > 100
        for: 30m
        labels: {severity: info}
        annotations:
          summary: More than 100 items were given up after their retries
          description: Look at analysis.dead_letters, fix the cause, then run sb-analysis replay-failed.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-analysis/blob/main/docs/runbooks/analysis.md#dead-letters
      - alert: AnalysisRefusalsHigh
        expr: |
          sum by (route) (rate(sb_analysis_refusals_total[1h]))
            / clamp_min(sum by (route) (rate(sb_analysis_provider_requests_total{outcome="ok"}[1h])), 1e-9) > 0.02
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "More than 2% of {{ $labels.route }} requests are refused by the model"
          description: Safety classifiers decline the content; refused items go to the fallback or are stored as refused.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-analysis/blob/main/docs/runbooks/analysis.md#refusals
      - alert: AnalysisFallbackShareHigh
        expr: |
          sum by (route) (rate(sb_analysis_fallback_total[1h]))
            / clamp_min(sum by (route) (rate(sb_analysis_provider_requests_total{outcome="ok"}[1h])), 1e-9) > 0.05
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: "More than 5% of {{ $labels.route }} requests are served by the fallback provider"
          description: Mixed models make trends less comparable; check the primary provider's health.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-analysis/blob/main/docs/runbooks/analysis.md#provider-outage
      - alert: AnalysisBudgetNearlySpent
        expr: max(sb_analysis_spent_today_usd) > 0.8 * max(sb_analysis_budget_daily_usd) and max(sb_analysis_budget_daily_usd) > 0
        for: 5m
        labels: {severity: info}
        annotations:
          summary: The analysis has spent more than 80% of today's budget
          description: At 100% non-urgent work pauses until the next Iraq day.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-analysis/blob/main/docs/runbooks/analysis.md#budget
      - alert: AnalysisOutboxBacklog
        expr: max(sb_analysis_outbox_backlog) > 10000
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: Analysis results and media acks are not reaching Kafka
          description: The relay role is down or cannot produce; media acks wait too, so files may hit their TTL.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-analysis/blob/main/docs/runbooks/analysis.md#outbox
      - alert: AnalysisRateLimitNotShared
        expr: sum by (provider) (rate(sb_analysis_rate_limit_fallback_total[10m])) > 0
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "{{ $labels.provider }} requests are limited per pod: Valkey is unreachable"
          description: Each pod sends at its share of the rate (analysis.rate_limit.fallback_divisor); with more pods than that, the provider sees more than its limit.
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-analysis/blob/main/docs/runbooks/analysis.md#rate-limits
      - alert: AnalysisIngestPaused
        expr: max(sb_analysis_ingest_paused) == 1
        for: 1h
        labels: {severity: warning}
        annotations:
          summary: The analysis queue has been full for an hour; new posts and comments wait in Kafka
          description: Kafka keeps 7 days; content waiting longer is lost from Kafka and needs a backfill. Clear the queue's cause (budget, provider, batches).
          runbook_url: https://github.com/abdullah95k/securebrand-microservices-analysis/blob/main/docs/runbooks/analysis.md#queue-backlog
