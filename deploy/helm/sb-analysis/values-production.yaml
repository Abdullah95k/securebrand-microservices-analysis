# Production values for the platform's cluster (namespace "analysis",
# deployed by Argo CD from gitops/services/analysis.yaml in the platform
# repository). The platform builds the images from a commit of this
# repository and sets image.repository/tag and mediaImage.repository/tag.
#
# Every topic and Schema Registry subject is the platform's: this chart
# creates none and registers none.

# On (the owner, 7 November 2026), after REQ-022 (contract v1.2.0). The
# platform's Kafka user may write analysis.* again from the commit the
# master pins with this change.
components:
  analysis:
    replicas: 1
  analysis-media:
    replicas: 1

# Speech in videos (the owner, 7 November 2026), transcribed inside the
# cluster: Speaches with Whisper large-v3-turbo on CPU (no GPU nodes). The
# platform's captions come first; Whisper takes the videos without them,
# one at a time, the first 10 minutes at most.
# A second server (the owner, 11 November 2026; D-052) is
# whisper.replicas: 2, set by the platform once the cluster has the CPU
# (2 CPU and 4Gi requested per server).
whisper:
  enabled: true
  storage: {size: 10Gi, storageClassName: do-block-storage}

# The registry's pull secret: DigitalOcean puts it ("securebrand") only on
# the namespace's default ServiceAccount, and the chart's pods run as their
# own.
imagePullSecrets:
  - name: securebrand

# Credentials from the secret "platform-credentials" in the namespace:
# POSTGRES_* (database "analysis", PostgreSQL 18), KAFKA_* (user
# analysis-kafka: content.* and analysis.*; also consumes fb.* and
# registry.* and produces fb.media.processed.v1), S3_* (media read from
# S3_BUCKET_MEDIA, under each collector's prefix), VALKEY_* (shared rate
# limits). ClickHouse (secret clickhouse-ro) comes with REQ-011 fix 9.
platformCredentials:
  enabled: true
  secret: platform-credentials
  # The CAs: Kafka's brokers have no public CA, so the client needs it.
  files:
    KAFKA_CA_CERT: kafka-ca.pem
    POSTGRES_CA_CERT: postgres-ca.pem
    VALKEY_CA_CERT: valkey-ca.pem

# The AI provider's key: secret "ai-provider", key API_KEY.
aiProvider:
  enabled: true
  secret: ai-provider
  key: API_KEY
  provider: anthropic

serviceMonitor:
  enabled: false
alerts:
  enabled: false

config:
  service: {name: sb-analysis, env: prod}
  log: {level: info, format: json}
  kafka:
    client_id: sb-analysis
    topic_prefix: ""
    # Enabled by the secret's KAFKA_TLS; the CA from KAFKA_CA_CERT.
    tls: {ca_file: /etc/sb-analysis-certs/kafka-ca.pem}
  # The providers' rate limits, shared by every pod (VALKEY_*); TLS on by
  # the secret's VALKEY_TLS.
  valkey:
    tls: {ca_file: /etc/sb-analysis-certs/valkey-ca.pem}
  # PostgreSQL is reached through DigitalOcean's PgBouncer in transaction
  # mode (50 connections for every service): sb-analysis keeps no prepared
  # statements or session state (internal/platform/pg) and opens at most 4
  # connections per process.
  postgres:
    # The secret's parts (platformCredentials) are used; no DSN. The
    # platform sets sslmode verify-full with the CA (Let's Encrypt's roots):
    # the server's certificate and its host name are checked.
    dsn: ""
    sslrootcert: /etc/sb-analysis-certs/postgres-ca.pem
    max_conns: 4
  analysis:
    consumer_group: sb-analysis
    postgres:
      dsn: ""            # "" = the parts above
      max_conns: 4
    # Every collector (the owner, 7 November 2026): the contract's content.*
    # topics, which fbs, tks, yts and igs publish as each adopts the
    # contract, and fbs's own fb.* topics until fbs does (their results stay
    # in Postgres; they have no contract IDs).
    inputs: [content, fb]
    # $60 a day, a hard stop (the owner, 11 November 2026; D-052, raised
    # from $10, D-031): once today's spend (Iraq time) reaches it, every
    # paid call waits for the next day, urgent items and the topic and
    # entity curation included; sb_analysis_budget_paused is 1 and
    # AnalysisBudgetReached fires. The whisper server is free and keeps
    # transcribing.
    budget: {daily_usd: 60, allow_unlimited: false, urgent_exempt: false}
    # Haiku only (the owner, 7 November 2026): the text, image and video
    # routes already use it; the stronger second opinion (escalation) and
    # the quality sample (audit, Claude Opus) are off; the topic and entity
    # curation use Haiku.
    # Caps per route within the $60 (11 November 2026, with D-052), so
    # neither side starves the other: images and video together stop at
    # $30, so comments and posts always keep at least $30 (about 230k
    # items a day); comments and posts together stop at $42, so media
    # always keeps at least $18. Room one side leaves goes to the other, up
    # to its caps.
    # 10% of comments, on every platform (the owner, 11 November 2026;
    # D-053): the same comments always (by content ID), the backlog
    # included. The rest are counted, not stored or analysed; their raw text
    # stays with the platform for later.
    comments: {sample_share: 0.10}
    routes:
      escalation: {enabled: false, model: claude-haiku-5-5}
      audit: {enabled: false, model: claude-haiku-5-5}
      comment: {daily_usd: 30}
      post: {daily_usd: 12}
      image: {daily_usd: 18}
      video: {daily_usd: 12}
    topics:
      curation: {model: claude-haiku-5-5}
    # Speech-to-text on the whisper server above (its address is set by
    # the chart). On shared CPUs it runs at about real time or slower, so
    # a 10-minute video can take 10-20 minutes: the call may take 20
    # minutes, isn't retried at once (a failed video comes back through
    # the media queue's own retries), and a media job's lease covers it.
    providers:
      whisper: {timeout: 20m, max_retries: 0}
    media:
      lease: 45m
      video:
        stt_provider: whisper
        stt_language: ar
        stt_concurrency: 1
