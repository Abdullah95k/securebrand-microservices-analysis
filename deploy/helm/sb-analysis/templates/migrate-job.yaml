{{- if .Values.migrate.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sba.fullname" . }}-migrate
  labels: {{- include "sba.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "sba.selector" (dict "root" . "name" "migrate") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      # The namespace's default account: the hook runs before this
      # release's own account exists, and needs no Kubernetes API.
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "sba.image" (dict "root" .) | quote }}
          imagePullPolicy: {{ include "sba.pullPolicy" (dict "root" .) }}
          args: ["migrate"]
          env: {{- include "sba.env" . | nindent 12 }}
          {{- include "sba.envFrom" . | nindent 10 }}
          resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {memory: 256Mi}}
          securityContext: {{- toYaml .Values.securityContext | nindent 12 }}
          volumeMounts: {{- include "sba.volumeMounts" . | nindent 12 }}
      volumes: {{- include "sba.hookVolumes" . | nindent 8 }}
{{- end }}
