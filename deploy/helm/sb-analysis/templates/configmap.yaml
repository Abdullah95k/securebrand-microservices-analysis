apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sba.fullname" . }}-config
  labels: {{- include "sba.labels" . | nindent 4 }}
data:
  config.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
{{- if .Values.migrate.enabled }}
---
# The same config for the migrate hook, which runs before the release's own
# resources exist.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "sba.fullname" . }}-hook-config
  labels: {{- include "sba.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
data:
  config.yaml: |
    {{- toYaml .Values.config | nindent 4 }}
{{- end }}
