; PgBouncer in front of the test Postgres, set up as production's
; (DigitalOcean's pooler): transaction pooling, no prepared-statement
; tracking, several server connections per pool. make test-pgbouncer runs
; the tests through it; CI does too. The password is the test default.
[databases]
* = host=postgres port=5432

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
; As production (DigitalOcean): transaction pooling, no prepared-statement
; tracking, several server connections per pool.
pool_mode = transaction
max_prepared_statements = 0
default_pool_size = 4
max_client_conn = 500
