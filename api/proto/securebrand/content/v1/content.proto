syntax = "proto3";

package securebrand.content.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/abdullah95k/securebrand-microservices/gen/go/securebrand/content/v1;contentv1";

// Platform a content item was collected from.
enum Platform {
  PLATFORM_UNSPECIFIED = 0;
  PLATFORM_FACEBOOK = 1;
  PLATFORM_INSTAGRAM = 2;
  PLATFORM_TIKTOK = 3;
  PLATFORM_X = 4;
  PLATFORM_TELEGRAM = 5;
  PLATFORM_YOUTUBE = 6;
}

enum ContentKind {
  CONTENT_KIND_UNSPECIFIED = 0;
  // A top-level publication of a source (page post, tweet, channel message, video).
  CONTENT_KIND_POST = 1;
  // A reply to a post.
  CONTENT_KIND_COMMENT = 2;
  // A reply to a comment.
  CONTENT_KIND_REPLY = 3;
}

enum AuthorType {
  AUTHOR_TYPE_UNSPECIFIED = 0;
  AUTHOR_TYPE_PERSON = 1;
  AUTHOR_TYPE_ORGANIZATION = 2;
}

enum ContentStatus {
  // Visible when observed.
  CONTENT_STATUS_UNSPECIFIED = 0;
  CONTENT_STATUS_VISIBLE = 1;
  // No longer publicly visible. Only the ids, times and status are set; the
  // consumer keeps what it already has.
  CONTENT_STATUS_DELETED = 2;
  // Content removed by an erasure or suppression rule: consumers must drop
  // the text and everything derived from it.
  CONTENT_STATUS_REDACTED = 3;
}

enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  MEDIA_KIND_IMAGE = 1;
  MEDIA_KIND_VIDEO = 2;
  MEDIA_KIND_AUDIO = 3;
  MEDIA_KIND_GIF = 4;
  MEDIA_KIND_STICKER = 5;
}

// Mention is an account or entity tagged in the text. Mentions of private
// persons carry no id or name: only their type and position.
message Mention {
  int32 offset = 1;
  int32 length = 2;
  // user | page | channel | hashtag | url
  string type = 3;
  // Display name, for organisations and public pages only.
  string name = 4;
}

message MediaRef {
  // Stable id of the media item (the collector's media id).
  string media_id = 1;
  MediaKind kind = 2;
  string alt_text = 3;
  int64 duration_ms = 4;
}

message Engagement {
  int64 reactions = 1;
  int64 replies = 2;
  int64 shares = 3;
  int64 views = 4;
}

// ContentItem is the canonical, platform-neutral text item every
// normalisation service publishes on content.item.v1, keyed by thread_id so
// a post and its comments stay in one partition, in order.
message ContentItem {
  // Globally unique: "<platform>:<kind>:<native id>", e.g. "fb:comment:123".
  string content_id = 1;
  Platform platform = 2;
  ContentKind kind = 3;
  string native_id = 4;
  // Page, channel or account the item belongs to, e.g. "fb:page:42".
  string source_id = 5;
  string source_name = 6;
  // Content id of the root post, and of the direct parent (comments and
  // replies). Empty for posts.
  string thread_id = 7;
  string parent_id = 8;
  // Pseudonymous author key (HMAC); never a name or a platform id.
  bytes author_key = 9;
  AuthorType author_type = 10;
  // True when the author is the source itself (a page replying on its post).
  bool author_is_source = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp observed_at = 13;
  string text = 14;
  // Language hint from the platform (BCP 47), when it gives one.
  string lang_hint = 15;
  repeated string hashtags = 16;
  repeated Mention mentions = 17;
  repeated string links = 18;
  repeated MediaRef media = 19;
  // Source the item was forwarded or reshared from (Telegram forwards,
  // reshares), as a source id.
  string forwarded_from = 20;
  bool is_reshare = 21;
  Engagement engagement = 22;
  ContentStatus status = 23;
  // The collector's event id, for tracing.
  string source_event_id = 24;
}

// MediaReady announces a downloaded media file to analyse, on
// content.media.ready.v1 keyed by media_id. Consumers acknowledge it with
// MediaProcessed on content.media.processed.v1.
message MediaReady {
  string event_id = 1;
  string media_id = 2;
  MediaKind kind = 3;
  Platform platform = 4;
  // Content id of the item the media belongs to.
  string owner_content_id = 5;
  string source_id = 6;
  string bucket = 7;
  string key = 8;
  int64 size = 9;
  string content_type = 10;
  int32 width = 11;
  int32 height = 12;
  int64 duration_ms = 13;
  string alt_text = 14;
  // The file is deleted at this time even without an acknowledgement.
  google.protobuf.Timestamp delete_after = 15;
}

enum ProcessStatus {
  PROCESS_STATUS_UNSPECIFIED = 0;
  PROCESS_STATUS_PROCESSED = 1;
  PROCESS_STATUS_FAILED_PERMANENT = 2;
  PROCESS_STATUS_FAILED_RETRYABLE = 3;
}

// MediaProcessed acknowledges a MediaReady on content.media.processed.v1:
// the collector may delete the file once every required consumer is done.
message MediaProcessed {
  string event_id = 1;
  string media_id = 2;
  string consumer = 3;
  ProcessStatus status = 4;
  google.protobuf.Timestamp processed_at = 5;
  string error = 6;
}

enum ErasureSubject {
  ERASURE_SUBJECT_UNSPECIFIED = 0;
  // Everything authored by author_key.
  ERASURE_SUBJECT_AUTHOR = 1;
  // Everything from source_id.
  ERASURE_SUBJECT_SOURCE = 2;
}

// Erasure is published on content.erasure.v1. Every consumer that stores
// content or anything derived from it must delete the subject's data.
message Erasure {
  string event_id = 1;
  string request_id = 2;
  ErasureSubject subject = 3;
  bytes author_key = 4;
  string source_id = 5;
  google.protobuf.Timestamp requested_at = 6;
}
